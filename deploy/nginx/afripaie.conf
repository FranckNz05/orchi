# Vhost Afripaie — afripaie.online
#
# Ce fichier est ADDITIF : il ne touche a aucun autre site servi par ce nginx.
# Certbot reecrira le bloc 443 et ajoutera la redirection une fois le
# certificat emis.

server {
    listen 80;
    listen [::]:80;
    server_name afripaie.online www.afripaie.online;

    # Laisse passer la validation ACME avant tout le reste.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sans cet en-tete, l'application se croit en HTTP derriere le proxy et
        # refuse de poser le cookie de session, qui est `secure` en production.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un encaissement mobile money attend la reponse de l'agregateur : 30 s
        # par defaut couperait des transactions en cours.
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Les notifications entrantes des agregateurs sont signees sur les
        # octets recus. Toute reecriture du corps invaliderait la signature.
        proxy_request_buffering off;
        client_max_body_size 2m;
    }
}
