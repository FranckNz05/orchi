# Orchi — deploiement Render (Blueprint)
#
# Render lit ce fichier et cree le service web et ses secrets. Voir
# docs/DEPLOIEMENT.md pour la procedure et ses limites.
#
# LA BASE N'EST PAS CREEE ICI, ET C'EST DELIBERE
#
# Render n'autorise qu'UNE SEULE base PostgreSQL gratuite par compte. Un
# blueprint qui en declare une echoue donc des qu'il en existe deja une
# ailleurs — et il echoue en entrainant le service web avec lui, sur un
# message (« cannot have more than one active free tier database ») qui laisse
# croire a un probleme de configuration alors qu'il s'agit d'un quota.
#
# DATABASE_URL est donc demandee au deploiement. Trois facons de la remplir,
# detaillees dans docs/DEPLOIEMENT.md :
#   - une base PostgreSQL Render existante, avec `?schema=orchi` ajoute a
#     l'URL pour que les tables d'Orchi ne se melangent pas a celles d'un
#     autre projet ;
#   - une base hebergee ailleurs (Neon, Supabase) ;
#   - une base Render creee a la main, gratuite ou payante.
#
# Pour revenir a une creation automatique le jour ou le quota est libre :
# retablir un bloc `databases:` et remplacer la valeur `sync: false` de
# DATABASE_URL par `fromDatabase: { name: orchi-db, property: connectionString }`.
#
# NOTE SUR LE MOTEUR — le developpement se fait sur SQLite, la production sur
# PostgreSQL. Le schema Prisma a ete tenu portable des le depart, et
# scripts/set-db-provider.mjs aligne le provider sur DATABASE_URL au moment du
# build. Aucune reecriture du schema n'est necessaire.

services:
  - type: web
    name: orchi
    runtime: node
    plan: free
    region: frankfurt # le plus proche de l'Afrique de l'Ouest chez Render
    branch: main

    # `--include=dev` est INDISPENSABLE, et la raison n'a rien d'evident :
    # NODE_ENV=production est declare plus bas, Render expose les variables des
    # le build, et npm en deduit qu'il doit omettre les devDependencies. Or
    # `prisma` et `typescript` en font partie — sans ce drapeau, le build
    # echoue sur un « prisma: not found » qui ne designe pas sa cause.
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm run render:start

    # /health/ready plutot que /health : le second prouve seulement que le
    # processus repond, le premier interroge la base. Un service qui ecoute
    # sans pouvoir lire ses donnees n'est pas en ligne, et Render doit le
    # signaler comme un echec de deploiement plutot que le laisser servir des
    # 500 aux marchands.
    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production

      # URL de connexion PostgreSQL, demandee au deploiement (voir l'en-tete).
      # Sur une base partagee avec un autre projet, terminer par
      # `?schema=orchi` : Prisma cree le schema s'il n'existe pas, et les
      # tables restent cloisonnees.
      - key: DATABASE_URL
        sync: false

      # Chiffrement AES-256-GCM des credentials agregateurs, et poivre du
      # hachage des cles API. Render les genere une fois et ne les reaffiche
      # jamais.
      #
      # ATTENTION — ces deux valeurs ne sont PAS interchangeables avec celles du
      # poste de developpement. Changer ENCRYPTION_KEY rend illisibles tous les
      # credentials deja chiffres ; changer API_KEY_PEPPER invalide toutes les
      # cles API deja distribuees.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true

      # PUBLIC_BASE_URL n'est pas declaree : Render injecte RENDER_EXTERNAL_URL
      # et src/core/env.ts s'en sert par defaut. Declarer la variable ici la
      # rendrait prioritaire — a faire uniquement pour un domaine personnalise.

      # Premier administrateur de la plateforme.
      #
      # Sans lui, personne ne peut ouvrir /admin, donc aucun marchand ne peut
      # etre verifie : le deploiement serait fonctionnel mais inutilisable. Le
      # plan gratuit n'ouvre pas de shell, il n'y aurait aucun autre moyen de
      # creer ce compte.
      #
      # Ce n'est pas une brèche dans la regle « aucune route n'accorde
      # l'administration » : poser une variable d'environnement demande la main
      # sur le service, soit exactement le niveau de privilege qu'on
      # accorderait de toute facon. `sync: false` fait demander la valeur par
      # Render au moment du deploiement plutot que de l'ecrire ici — un mot de
      # passe n'a rien a faire dans un depot.
      #
      # A SUPPRIMER une fois le compte cree et le mot de passe change.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Le simulateur seul. Nos adaptateurs partenaires sont ecrits d'apres leur
      # documentation et n'ont jamais ete confrontes a un vrai compte sandbox :
      # les activer ici enverrait de vraies transactions sur un contrat suppose.
      - key: PROVIDERS_ENABLED
        value: sandbox

      # La console d'exploitation invite a coller une cle API secrete dans un
      # navigateur. Acceptable en local, pas sur une URL publique. Le tableau de
      # bord marchand et /admin passent, eux, par une session serveur.
      - key: CONSOLE_ENABLED
        value: "false"

      - key: WORKERS_ENABLED
        value: "true"

      - key: PLATFORM_TOTAL_PAYIN_BPS
        value: "500"
      - key: PLATFORM_TOTAL_PAYOUT_BPS
        value: "500"
      - key: PLATFORM_FEE_COLLECTION
        value: split

      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_MAX
        value: "300"
