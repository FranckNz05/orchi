# Orchi — deploiement Render (Blueprint)
#
# Render lit ce fichier et cree tout : le service web, la base PostgreSQL, et
# les secrets. Voir docs/DEPLOIEMENT.md pour la procedure et ses limites.
#
# NOTE SUR LA BASE — le developpement se fait sur SQLite, la production sur
# PostgreSQL. Le schema Prisma a ete tenu portable des le depart, et
# scripts/set-db-provider.mjs aligne le provider sur DATABASE_URL au moment du
# build. Aucune reecriture du schema n'est necessaire.

databases:
  - name: orchi-db
    databaseName: orchi
    user: orchi
    # `free` expire au bout de 30 jours chez Render : suffisant pour une
    # demonstration, a remplacer par `basic-256mb` des que des donnees comptent.
    plan: free

services:
  - type: web
    name: orchi
    runtime: node
    plan: free
    region: frankfurt # le plus proche de l'Afrique de l'Ouest chez Render
    branch: main
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start

    # /health/ready plutot que /health : le premier interroge la base, le
    # second se contente de prouver que le processus repond. Un service qui
    # ecoute mais ne peut plus lire ses donnees n'est pas en ligne, et Render
    # doit le signaler comme un echec de deploiement plutot que le laisser
    # servir des 500 aux marchands.
    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: orchi-db
          property: connectionString

      # Chiffrement AES-256-GCM des credentials agregateurs, et poivre du
      # hachage des cles API. Render les genere une fois et ne les reaffiche
      # jamais.
      #
      # ATTENTION — ces deux valeurs ne sont PAS interchangeables avec celles du
      # poste de developpement. Changer ENCRYPTION_KEY rend illisibles tous les
      # credentials deja chiffres ; changer API_KEY_PEPPER invalide toutes les
      # cles API deja distribuees.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true

      # PUBLIC_BASE_URL n'est pas declaree : Render injecte RENDER_EXTERNAL_URL
      # et src/core/env.ts s'en sert par defaut. Declarer la variable ici la
      # rendrait prioritaire — a faire uniquement pour un domaine personnalise.

      # Le simulateur seul. FedaPay, CinetPay et GeniusPay sont ecrits d'apres
      # leur documentation publique et n'ont jamais ete confrontes a un vrai
      # compte sandbox : les activer ici enverrait de vraies transactions sur
      # un contrat suppose.
      - key: PROVIDERS_ENABLED
        value: sandbox

      # La console d'exploitation invite a coller une cle API secrete dans un
      # navigateur. Acceptable en local, pas sur une URL publique.
      - key: CONSOLE_ENABLED
        value: "false"

      - key: WORKERS_ENABLED
        value: "true"

      - key: PLATFORM_TOTAL_PAYIN_BPS
        value: "500"
      - key: PLATFORM_TOTAL_PAYOUT_BPS
        value: "500"
      - key: PLATFORM_FEE_COLLECTION
        value: split

      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_MAX
        value: "300"
