<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connexion — Orchi</title>
<link rel="stylesheet" href="/assets/theme.css" />
<style>
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
  main { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px;
    max-width: var(--max); margin: 0 auto; padding: 20px 24px 40px; width: 100%; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .aside { display: none; } }

  .panel {
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 34px; max-width: 440px; width: 100%; justify-self: center;
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ""; position: absolute; inset: -1px -1px auto -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  h1 { font-size: 27px; letter-spacing: -0.03em; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  form { display: grid; gap: 17px; }
  label { display: grid; gap: 7px; font-size: 14px; font-weight: 600; }
  input {
    font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: #05070a; color: var(--ink);
    transition: border-color .16s, box-shadow .16s;
  }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .error {
    background: var(--danger-soft); color: var(--danger);
    border: 1px solid rgba(255,138,122,.35);
    border-radius: 10px; padding: 12px 15px; font-size: 14px; margin-bottom: 18px;
  }
  .alt { margin: 24px 0 0; font-size: 14.5px; color: var(--muted); text-align: center; }
  .alt a { color: var(--accent); }

  .aside { text-align: center; }
  .globe-wrap { height: 340px; position: relative; }
  #globe { width: 100%; height: 100%; display: block; }
  .aside p { color: var(--muted); font-size: 15px; max-width: 34ch; margin: 10px auto 0; }

  footer { padding: 24px; text-align: center; color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>

<nav class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"></span> Orchi</a>
    <div class="links"><a href="/register" class="btn">Créer un compte</a></div>
  </div>
</nav>

<main>
  <div class="panel">
    <h1>Connexion</h1>
    <p class="sub">Accédez à votre tableau de bord.</p>

    <div class="error" id="error" hidden></div>

    <form id="form">
      <label>
        Adresse e-mail
        <input type="email" name="email" required autocomplete="email" autofocus />
      </label>
      <label>
        Mot de passe
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn solid lg" id="submit">Se connecter</button>
    </form>

    <p class="alt">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
  </div>

  <div class="aside">
    <div class="globe-wrap"><canvas id="globe" aria-hidden="true"></canvas></div>
    <p>54 pays au catalogue, une seule interface à intégrer.</p>
  </div>
</main>

<footer><a href="/">Retour au site</a> · <a href="/register">Créer un compte</a></footer>

<script src="/assets/globe.js" defer></script>
<script>
(() => {
  'use strict';
  const form = document.getElementById('form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');

  form.onsubmit = async (e) => {
    e.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Connexion…';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      const body = await res.json();

      if (!res.ok) {
        error.textContent = body?.error?.message || 'Connexion impossible.';
        error.hidden = false;
        return;
      }
      // Le cookie de session est pose par le serveur : rien a stocker ici.
      window.location.href = body.next || '/app';
    } catch {
      error.textContent = 'Le serveur est injoignable.';
      error.hidden = false;
    } finally {
      submit.disabled = false;
      submit.textContent = 'Se connecter';
    }
  };
})();
</script>
</body>
</html>
